[project]
name = "johncd-cheatsheets"
version = "0.1.0"
description = "MkDocs documentation site for John's cheatsheets"
requires-python = ">=3.15"
dependencies = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocs-redirects>=1.2.2",
]

[dependency-groups]
dev = ["ruff>=0.15.10"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
