# Maintained dependency roots; immutable test fixtures are intentionally excluded.
version: 2
updates:
  - package-ecosystem: uv
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    directory: /.devcontainer
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: docker-compose
    directory: /.devcontainer
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: devcontainers
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    directory: /
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
