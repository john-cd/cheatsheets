name: Prek checks

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.md'
      - 'prek.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.md'

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v7
      - run: python scripts/dev_env.py uv sync --locked
      - run: python scripts/dev_env.py uv tool install prek
      - run: python scripts/dev_env.py prek run --all-files
