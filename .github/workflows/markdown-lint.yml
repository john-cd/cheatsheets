# TODO Reviewed ??-??-2026

name: Prek checks

on:
  push:
    branches: [main, develop]
    paths:
      - "**.md"
      - "prek.toml"
      - "dprint.jsonc"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "justfile"
      - "scripts/env.just"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".dockerignore"
      - ".aiexclude"
      - ".github/workflows/markdown-lint.yml"
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "**.md"
      - "prek.toml"
      - "dprint.jsonc"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "justfile"
      - "scripts/env.just"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - ".dockerignore"
      - ".aiexclude"
      - ".github/workflows/markdown-lint.yml"

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - name: Install Just
        # taiki-e/install-action v2.87.30
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b
        with:
          tool: just@1.59.0
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.13.7"
          cache-dependency-glob: "**/uv.lock"
      - run: just sync
      - run: just uv tool install prek
      - uses: dprint/check@v2.6
      - run: just hooks
