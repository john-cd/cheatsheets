name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: python scripts/dev_env.py uv sync --locked
      - run: python scripts/dev_env.py uv tool install prek
      - run: python scripts/dev_env.py prek run --all-files
      - run: python scripts/dev_env.py uv run python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/*.test.js
      - run: python scripts/dev_env.py uv run mkdocs build

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - run: python scripts/dev_env.py uv sync --locked
      - run: python scripts/dev_env.py uv run mkdocs gh-deploy --force
