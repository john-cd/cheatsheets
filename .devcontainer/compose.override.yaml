# Project-scoped Compose stack: cheatsheets-dev.
# Build inputs come from tracked .devcontainer/.env; from the repo root pass --env-file .devcontainer/.env.
# Keep credentials in ignored .devcontainer/.env.local; from the repo root pass it as a second --env-file when present.
# TODO Reviewed ??-??-2026

name: cheatsheets-dev
services:
  cheatsheets-site:
    image: johncd/cheatsheets_dev
    build:
      target: dev
      args:
        JUST_VERSION: ${JUST_VERSION:?Set JUST_VERSION in .devcontainer/.env or the host environment}
        PYTHON_VERSION: ${PYTHON_VERSION:?Set PYTHON_VERSION in .devcontainer/.env or the host environment}
        USERNAME: ${USERNAME:?Set USERNAME in .devcontainer/.env or the host environment}
        USER_GID: ${USER_GID:?Set USER_GID in .devcontainer/.env or the host environment}
        USER_UID: ${USER_UID:?Set USER_UID in .devcontainer/.env or the host environment}
        UV_VERSION: ${UV_VERSION:?Set UV_VERSION in .devcontainer/.env or the host environment}
        WORK_DIR: ${WORK_DIR:?Set WORK_DIR in .devcontainer/.env or the host environment}
    ports:
      - 8000:8000
    volumes:
      # Update this to wherever you want VS Code to mount the folder of your project
      - ..:/code:cached
      - /var/run/docker.sock:/var/run/docker-host.sock

    # Overrides default command so things don't shut down after the process ends.
    #command: /bin/sh -c "while sleep 1000; do :; done"
