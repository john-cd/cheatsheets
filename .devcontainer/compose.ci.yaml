# Project-scoped Compose stack: cheatsheets-ci.
# Build inputs come from tracked .devcontainer/.env; from the repo root pass --env-file .devcontainer/.env.
# Keep credentials in ignored .devcontainer/.env.local; from the repo root pass it as a second --env-file when present.
# TODO Reviewed ??-??-2026

# NOT IN USE YET in .github/workflows

name: cheatsheets-ci
services:
  cheatsheets-site:
    image: johncd/cheatsheets_ci
    build:
      target: ci
      args:
        JUST_VERSION: ${JUST_VERSION:?Set JUST_VERSION in .devcontainer/.env or the host environment}
        PYTHON_VERSION: ${PYTHON_VERSION:?Set PYTHON_VERSION in .devcontainer/.env or the host environment}
        DEBIAN_CODENAME: ${DEBIAN_CODENAME:?Set DEBIAN_CODENAME in .devcontainer/.env or the host environment}
        UV_VERSION: ${UV_VERSION:?Set UV_VERSION in .devcontainer/.env or the host environment}
        WORK_DIR: ${WORK_DIR:?Set WORK_DIR in .devcontainer/.env or the host environment}
      cache_from:
        - type=gha
      cache_to:
        - type=gha,mode=max
    # Bind the output folder to a folder in the CI host
    volumes:
      - ../site:/code/site
