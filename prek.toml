exclude = '^(drafts/|trash/|.*\.orig$)'

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
    { id = "end-of-file-fixer" },
    { id = "check-merge-conflict" },
    { id = "check-toml" },
]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.48.0"
hooks = [
    { id = "markdownlint", name = "Lint Markdown", args = ["--fix"] },
]

[[repos]]
repo = "https://github.com/tcort/markdown-link-check"
rev = "v3.14.2"
hooks = [
    { id = "markdown-link-check", name = "Check for broken links", args = ["--config", ".markdown-link-check.json"] },
]

[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "Ruff check", entry = "just lint", language = "system", types = ["python"], pass_filenames = false },
    { id = "ruff-format", name = "Ruff format", entry = "just fmt-check", language = "system", types = ["python"], pass_filenames = false },
]
